<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONSEQ — 新規コネクト</title>
<style>
  :root {
    --ink: #111318;
    --ink-soft: #565b65;
    --muted: #9297a1;
    --line: #e9e9eb;
    --line-strong: #d9dadd;
    --paper: #ffffff;
    --wash: #f7f7f8;
    --success: #167a54;
    --danger: #e7393f;
    --gold: #aa8a51;
    --serif: "Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
      "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html {
    color-scheme: light;
  }

  body {
    min-height: 100vh;
    margin: 0;
    padding: 38px 16px 72px;
    color: var(--ink);
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.96), rgba(255,255,255,0) 440px),
      #efeff0;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button {
    color: inherit;
    font: inherit;
  }

  .showcase {
    width: min(430px, 100%);
    margin: 0 auto;
  }

  .showcase + .showcase {
    margin-top: 48px;
  }

  .frame-caption {
    width: min(390px, 100%);
    margin: 0 auto 12px;
  }

  .frame-caption__eyebrow {
    margin: 0 0 5px;
    color: #777b83;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .frame-caption__title {
    margin: 0;
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: .03em;
  }

  .phone {
    position: relative;
    width: 390px;
    max-width: 100%;
    height: 820px;
    margin: 0 auto;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--paper);
    border: 1px solid rgba(20,22,28,.08);
    border-radius: 30px;
    box-shadow:
      0 28px 70px rgba(18,20,26,.12),
      0 3px 10px rgba(18,20,26,.05);
    scrollbar-width: none;
  }

  .phone::-webkit-scrollbar {
    display: none;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: 72px 1fr 72px;
    align-items: center;
    height: 54px;
    padding: 0 14px;
    background: rgba(255,255,255,.95);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .back-button {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    width: max-content;
    padding: 8px 4px 8px 0;
    background: transparent;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }

  .back-button svg {
    width: 18px;
    height: 18px;
  }

  .back-button:hover {
    color: #626771;
  }

  .back-button:active {
    transform: translateX(-1px);
    opacity: .58;
  }

  .topbar__title {
    overflow: hidden;
    font-size: 16px;
    font-weight: 680;
    letter-spacing: -.02em;
    text-align: center;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .capacity {
    position: sticky;
    top: 54px;
    z-index: 9;
    padding: 11px 13px 12px;
    background: rgba(251,251,252,.96);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .capacity__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 2px 9px;
  }

  .capacity__label {
    color: #777b83;
    font-size: 9px;
    font-weight: 750;
    letter-spacing: .16em;
  }

  .capacity__progress {
    color: var(--muted);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .capacity__grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .capacity-card {
    position: relative;
    min-width: 0;
    height: 37px;
    padding: 0 7px 6px;
    overflow: hidden;
    border-right: 1px solid var(--line);
  }

  .capacity-card:last-child {
    border-right: 0;
  }

  .capacity-card__line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 3px;
  }

  .capacity-card__name {
    font-family: var(--serif);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .capacity-card__count {
    color: #6f737c;
    font-size: 10px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .capacity-card__track {
    position: absolute;
    right: 7px;
    bottom: 1px;
    left: 7px;
    height: 2px;
    overflow: hidden;
    background: #e4e5e8;
    border-radius: 2px;
  }

  .capacity-card__fill {
    display: block;
    width: var(--fill);
    height: 100%;
    border-radius: inherit;
    transition: width 260ms cubic-bezier(.22,.8,.24,1);
  }

  .capacity-card--core .capacity-card__fill {
    background: linear-gradient(90deg, #17191e, #a98a54);
  }

  .capacity-card--orbit .capacity-card__fill {
    background: linear-gradient(90deg, #334963, #8da4bb);
  }

  .capacity-card--halo .capacity-card__fill {
    background: linear-gradient(90deg, #858992, #c6c8cc);
  }

  .capacity-card--galaxy .capacity-card__fill {
    background: linear-gradient(90deg, #6d657a, #b7adbf);
  }

  .capacity-card.is-full .capacity-card__name,
  .capacity-card.is-full .capacity-card__count {
    color: #a1a3a8;
  }

  .capacity-card.is-full .capacity-card__fill {
    background: #b8bbc1;
  }

  .intro {
    padding: 25px 15px 17px;
    background:
      radial-gradient(circle at 91% 18%, rgba(170,138,81,.075), transparent 70px),
      #fff;
  }

  .intro__kicker {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 6px;
    color: #777b83;
    font-size: 9px;
    font-weight: 750;
    letter-spacing: .17em;
  }

  .intro__orbit {
    position: relative;
    width: 13px;
    height: 13px;
    border: 1px solid #b9a276;
    border-radius: 50%;
  }

  .intro__orbit::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3px;
    height: 3px;
    background: #2a2d33;
    border-radius: 50%;
    content: "";
    transform: translate(-50%, -50%);
  }

  .intro__line {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 16px;
  }

  .intro h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 500;
    letter-spacing: .025em;
    line-height: 1.22;
  }

  .intro__count {
    display: flex;
    align-items: baseline;
    gap: 4px;
    padding-bottom: 2px;
    white-space: nowrap;
  }

  .intro__count strong {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .intro__count span {
    color: var(--muted);
    font-size: 10px;
  }

  .intro__description {
    margin: 9px 0 0;
    color: #777b83;
    font-size: 11px;
    line-height: 1.6;
  }

  .triage-list {
    border-top: 1px solid var(--line);
  }

  .person-row {
    position: relative;
    min-height: 105px;
    padding: 14px 14px 13px;
    overflow: hidden;
    background: #fff;
    border-bottom: 1px solid var(--line);
    transition:
      min-height 220ms cubic-bezier(.22,.8,.24,1),
      padding 220ms cubic-bezier(.22,.8,.24,1),
      background 160ms ease,
      opacity 160ms ease;
  }

  .person-row::after {
    position: absolute;
    right: 0;
    bottom: -1px;
    left: 70px;
    height: 1px;
    background: rgba(255,255,255,.8);
    content: "";
  }

  .person-row.is-confirmed {
    min-height: 62px;
    padding-top: 8px;
    padding-bottom: 8px;
    background: #fafafa;
    opacity: .72;
  }

  .person-default {
    transition: opacity 100ms ease, transform 180ms ease;
  }

  .person-row.is-confirmed .person-default {
    display: none;
  }

  .person-main {
    display: flex;
    align-items: center;
    min-width: 0;
    margin-bottom: 12px;
  }

  .avatar {
    position: relative;
    display: grid;
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    margin-right: 11px;
    place-items: center;
    overflow: hidden;
    color: rgba(255,255,255,.97);
    background: var(--avatar-bg);
    border: 1px solid rgba(0,0,0,.035);
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .avatar::before {
    position: absolute;
    top: -15%;
    left: -5%;
    width: 70%;
    height: 70%;
    background: rgba(255,255,255,.22);
    border-radius: 50%;
    content: "";
    filter: blur(9px);
  }

  .avatar span {
    position: relative;
  }

  .person-info {
    min-width: 0;
    flex: 1;
  }

  .person-name {
    overflow: hidden;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -.025em;
    line-height: 1.25;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .person-meta {
    display: flex;
    align-items: center;
    min-width: 0;
    margin-top: 5px;
  }

  .enamel {
    position: relative;
    display: inline-grid;
    flex: 0 0 19px;
    width: 19px;
    height: 19px;
    margin-right: 5px;
    place-items: center;
    color: #fff;
    background: var(--enamel);
    border: 1px solid rgba(255,255,255,.95);
    border-radius: 50%;
    box-shadow:
      0 1px 2px rgba(19,21,27,.24),
      inset 0 1px 1px rgba(255,255,255,.22);
  }

  .enamel::after {
    position: absolute;
    inset: 1.5px;
    border: .5px solid rgba(255,255,255,.28);
    border-radius: inherit;
    content: "";
  }

  .enamel svg {
    position: relative;
    z-index: 1;
    width: 11px;
    height: 11px;
    overflow: visible;
  }

  .enamel--human {
    --enamel: linear-gradient(135deg, #6b7280, #4b5563);
  }

  .enamel--leader {
    --enamel: linear-gradient(135deg, #b45309, #78350f);
  }

  .enamel--icon {
    --enamel: linear-gradient(135deg, #0f8b6d, #065f46);
  }

  .enamel--rising {
    --enamel: linear-gradient(135deg, #168c84, #3f6212);
  }

  .enamel--star {
    --enamel: linear-gradient(135deg, #2563a8, #155e75);
  }

  .enamel--nova {
    --enamel: linear-gradient(135deg, #7c3aed, #86198f);
  }

  .enamel--supernova {
    --enamel: linear-gradient(135deg, #be3655, #9a3412);
  }

  .enamel--gravity {
    --enamel: linear-gradient(135deg, #4338a8, #115e59);
  }

  .enamel--singularity {
    --enamel: linear-gradient(135deg, #475569, #4c1d95);
  }

  .enamel--universe {
    --enamel: linear-gradient(135deg, #4d7c0f, #0f766e 52%, #3b0764);
  }

  .tier-name {
    font-size: 10px;
    font-weight: 820;
    letter-spacing: .055em;
    white-space: nowrap;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tier--human {
    color: #4b5563;
    background-image: linear-gradient(135deg, #4b5563, #7d8590);
  }

  .tier--leader {
    color: #92400e;
    background-image: linear-gradient(135deg, #92400e, #e6a01c);
  }

  .tier--icon {
    color: #047857;
    background-image: linear-gradient(135deg, #047857, #34d399);
  }

  .tier--rising {
    color: #0d9488;
    background-image: linear-gradient(135deg, #0d9488, #84cc16);
  }

  .tier--star {
    color: #1e40af;
    background-image: linear-gradient(135deg, #1e40af, #06b6d4);
  }

  .tier--nova {
    color: #6d28d9;
    background-image: linear-gradient(135deg, #6d28d9, #c026d3);
  }

  .tier--supernova {
    color: #be123c;
    background-image: linear-gradient(135deg, #be123c, #f97316);
  }

  .tier--gravity {
    color: #312e81;
    background-image: linear-gradient(135deg, #312e81, #0d9488);
  }

  .tier--singularity {
    color: #0f172a;
    background-image: linear-gradient(135deg, #0f172a, #7c3aed);
  }

  .tier--universe {
    color: #1a2e05;
    background-image: linear-gradient(135deg, #1a2e05, #84cc16 37%, #0d9488 65%, #4c1d95);
  }

  .score {
    display: inline-flex;
    align-items: center;
    margin-left: 6px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 620;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .score::before {
    width: 2px;
    height: 2px;
    margin-right: 6px;
    background: #bbbfc6;
    border-radius: 50%;
    content: "";
  }

  .tier-chips {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 5px;
  }

  .tier-chip {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    height: 29px;
    padding: 0 2px;
    overflow: hidden;
    background: #fff;
    border: 1px solid #dfe0e3;
    border-radius: 999px;
    cursor: pointer;
    font-size: 10.5px;
    font-weight: 680;
    letter-spacing: -.01em;
    white-space: nowrap;
    transition:
      color 130ms ease,
      background 130ms ease,
      border-color 130ms ease,
      box-shadow 130ms ease,
      transform 80ms ease;
  }

  .tier-chip::after {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    content: "";
    opacity: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.65);
    transition: opacity 130ms ease;
  }

  .tier-chip:hover:not(:disabled) {
    z-index: 1;
    background: #f7f7f8;
    border-color: #9ea2aa;
    box-shadow: 0 3px 8px rgba(20,22,27,.07);
  }

  .tier-chip:hover:not(:disabled)::after {
    opacity: 1;
  }

  .tier-chip:active:not(:disabled) {
    background: #ededee;
    box-shadow: none;
    transform: scale(.965);
  }

  .tier-chip--core {
    color: #17191e;
    border-color: #30333a;
    box-shadow: inset 0 0 0 1px rgba(170,138,81,.18);
  }

  .tier-chip--core::before {
    width: 5px;
    height: 5px;
    margin-right: 4px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    content: "";
    box-shadow: 0 0 0 2px rgba(170,138,81,.12);
  }

  .tier-chip--core:hover:not(:disabled) {
    color: #fff;
    background: #1c1e23;
    border-color: #1c1e23;
  }

  .tier-chip--orbit {
    color: #40546b;
    border-color: #c8d0d8;
    background: #fbfcfd;
  }

  .tier-chip--halo {
    color: #666a72;
  }

  .tier-chip--galaxy {
    color: #665d70;
    border-color: #d9d4dc;
    background: #fdfcfd;
  }

  .tier-chip--connect {
    color: #777b83;
    border-style: dashed;
  }

  .tier-chip:disabled {
    color: #b0b2b7;
    background: #f3f3f4;
    border-color: #e4e4e6;
    border-style: solid;
    box-shadow: none;
    cursor: not-allowed;
    opacity: .68;
  }

  .tier-chip--core:disabled::before {
    border-color: #b9bbc0;
    box-shadow: none;
  }

  .confirmed-view {
    display: none;
    align-items: center;
    width: 100%;
    min-height: 45px;
  }

  .person-row.is-confirmed .confirmed-view {
    display: flex;
  }

  .confirmed-main {
    display: flex;
    min-width: 0;
    flex: 1;
    align-items: center;
    align-self: stretch;
    padding: 4px 7px 4px 2px;
    background: transparent;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    transition: background 130ms ease, transform 80ms ease;
  }

  .confirmed-main:hover {
    background: #f0f0f1;
  }

  .confirmed-main:active {
    background: #e8e8ea;
    transform: scale(.99);
  }

  .confirmed-orbit {
    position: relative;
    display: grid;
    flex: 0 0 29px;
    width: 29px;
    height: 29px;
    margin-right: 9px;
    place-items: center;
    border: 1px solid #aeb2b9;
    border-radius: 50%;
  }

  .confirmed-orbit::before {
    width: 5px;
    height: 5px;
    background: #71757d;
    border-radius: 50%;
    content: "";
  }

  .confirmed-orbit::after {
    position: absolute;
    top: -2px;
    width: 4px;
    height: 4px;
    background: #fff;
    border: 1px solid #747881;
    border-radius: 50%;
    content: "";
  }

  .person-row[data-assigned="core"] .confirmed-orbit {
    border-color: #8d7448;
    box-shadow: inset 0 0 0 3px rgba(170,138,81,.1);
  }

  .person-row[data-assigned="core"] .confirmed-orbit::before {
    background: #25272d;
  }

  .person-row[data-assigned="orbit"] .confirmed-orbit {
    border-color: #70859c;
  }

  .person-row[data-assigned="halo"] .confirmed-orbit {
    border-color: #aaaeb5;
  }

  .person-row[data-assigned="galaxy"] .confirmed-orbit {
    border-color: #8c8195;
  }

  .person-row[data-assigned="connect"] .confirmed-orbit {
    border-style: dashed;
    border-color: #afb1b6;
  }

  .confirmed-copy {
    min-width: 0;
    flex: 1;
  }

  .confirmed-copy__top {
    display: flex;
    align-items: baseline;
    min-width: 0;
    gap: 6px;
  }

  .confirmed-check {
    color: var(--success);
    font-size: 12px;
    font-weight: 800;
  }

  .confirmed-tier {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  .confirmed-divider {
    color: #c1c3c7;
    font-size: 11px;
  }

  .confirmed-name {
    overflow: hidden;
    color: #555a63;
    font-size: 13px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .confirmed-hint {
    margin: 3px 0 0 18px;
    color: #a0a3a9;
    font-size: 9.5px;
  }

  .undo-button {
    flex: 0 0 auto;
    padding: 10px 3px 10px 9px;
    color: #6f737b;
    background: transparent;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 10px;
    text-decoration: underline;
    text-decoration-color: #b9bbc0;
    text-underline-offset: 3px;
    transition: color 130ms ease, background 130ms ease, transform 80ms ease;
  }

  .undo-button:hover {
    color: #17191e;
    background: #eeeeef;
  }

  .undo-button:active {
    transform: scale(.94);
  }

  .back-button:focus-visible,
  .tier-chip:focus-visible,
  .confirmed-main:focus-visible,
  .undo-button:focus-visible,
  .profile-button:focus-visible {
    outline: 2px solid #181a1f;
    outline-offset: 2px;
  }

  .footnote {
    margin: 0;
    padding: 18px 15px 24px;
    color: #989ba2;
    font-size: 10.5px;
    text-align: center;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    border: 0;
    clip: rect(0,0,0,0);
    white-space: nowrap;
  }

  .profile-reference {
    width: 390px;
    max-width: 100%;
    margin: 0 auto;
    padding: 24px 16px 22px;
    background: #fff;
    border: 1px solid rgba(20,22,28,.07);
    border-radius: 22px;
    box-shadow: 0 12px 34px rgba(18,20,26,.08);
  }

  .profile-reference__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -4px 0 19px;
  }

  .profile-reference__handle {
    font-size: 14px;
    font-weight: 700;
  }

  .profile-reference__menu {
    color: #62666e;
    font-size: 19px;
    letter-spacing: -.18em;
  }

  .profile-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .profile-button-wrap {
    position: relative;
    min-width: 0;
  }

  .profile-button {
    width: 100%;
    height: 34px;
    padding: 0 5px;
    overflow: hidden;
    background: #f3f4f6;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 650;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: background 120ms ease, transform 80ms ease;
  }

  .profile-button:hover {

  }

  .profile-button:active {

  .new-badge {

    box-shadow: 0 2px 5px rgba(190,22,29,.22);
    font-size: 9px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 420px) {
    body {
      padding-right: 8px;

  @media (prefers-reduced-motion: reduce) {
    *,

      scroll-behavior: auto !important;
      transition-duration: .01ms !important;

</style>

<body>

<svg class="sr-only" aria-hidden="true" focusable="false">

<main>
  <section class="showcase" aria-labelledby="triage-frame-title">

    <div class="phone">

        <p class="intro__description">一人ずつ、あなたとの距離を選んでください。</p>

      <div class="triage-list" id="triage-list"></div>

      <p class="footnote">※配置は相手には見えません</p>

        <button class="profile-button" type="button">Group Settings</button>

</main>

<script>
(() => {
  "use strict";

  const circles = {
    core: {
      label: "Core",
      current: 7,
      max: 10
    },
    orbit: {
      label: "Orbit",
      current: 12,
      max: 15
    },
    halo: {
      label: "Halo",
      current: 31,
      max: 50
    },
    galaxy: {
      label: "Galaxy",
      current: 88,
      max: 150
    },
    connect: {
      label: "Connect",
      current: 0,
      max: Infinity
    }
  };

  const capacityOrder = ["core", "orbit", "halo", "galaxy"];
  const chipOrder = ["core", "orbit", "halo", "galaxy", "connect"];

  const people = [
    { id: "p01", name: "田中 悠",        initials: "悠",  score: 820,     avatar: "linear-gradient(145deg,#b8a995,#756e68)" },
    { id: "p02", name: "Sofia Martinez", initials: "SM", score: 340,     avatar: "linear-gradient(145deg,#bd9d98,#79636a)" },
    { id: "p03", name: "岡田 真由",      initials: "真",  score: 1200,    avatar: "linear-gradient(145deg,#b9a07d,#75604d)" },
    { id: "p04", name: "Noah Garcia",    initials: "NG", score: 2650,    avatar: "linear-gradient(145deg,#82959b,#526267)" },
    { id: "p05", name: "鈴木 里奈",      initials: "里",  score: 6300,    avatar: "linear-gradient(145deg,#839c91,#4d655d)" },
    { id: "p06", name: "Daniel Kim",     initials: "DK", score: 8900,    avatar: "linear-gradient(145deg,#9290a5,#5f5d73)" },
    { id: "p07", name: "渡辺 彩",        initials: "彩",  score: 24700,   avatar: "linear-gradient(145deg,#94a379,#5b6946)" },
    { id: "p08", name: "James Anderson", initials: "JA", score: 38200,   avatar: "linear-gradient(145deg,#799c9c,#466566)" },
    { id: "p09", name: "佐藤 健太",      initials: "健",  score: 68400,   avatar: "linear-gradient(145deg,#849bb4,#50657a)" },
    { id: "p10", name: "Emma Wilson",    initials: "EW", score: 121000,  avatar: "linear-gradient(145deg,#86a1ad,#526a77)" },
    { id: "p11", name: "山田 彩香",      initials: "香",  score: 187000,  avatar: "linear-gradient(145deg,#a08ab2,#685878)" },
    { id: "p12", name: "Lucas Silva",    initials: "LS", score: 312000,  avatar: "linear-gradient(145deg,#a484aa,#65536d)" },
    { id: "p13", name: "伊藤 大輔",      initials: "大",  score: 620000,  avatar: "linear-gradient(145deg,#ad7f7c,#704e4c)" },
    { id: "p14", name: "Olivia Brown",   initials: "OB", score: 870000,  avatar: "linear-gradient(145deg,#b18b7d,#755749)" },
    { id: "p15", name: "中島 誠",        initials: "誠",  score: 1200000, avatar: "linear-gradient(145deg,#777f9e,#484f6b)" },
    { id: "p16", name: "高橋 美咲",      initials: "美",  score: 1650000, avatar: "linear-gradient(145deg,#778f91,#485f60)" },
    { id: "p17", name: "Mia Chen",       initials: "MC", score: 2400000, avatar: "linear-gradient(145deg,#7f829e,#4b4c69)" },
    { id: "p18", name: "森 拓也",        initials: "拓",  score: 3800000, avatar: "linear-gradient(145deg,#7f7895,#504961)" },
    { id: "p19", name: "Alex Johnson",   initials: "AJ", score: 5800000, avatar: "linear-gradient(145deg,#748d7b,#475c4e)" },
    { id: "p20", name: "藤田 悠斗",      initials: "悠",  score: 8200000, avatar: "linear-gradient(145deg,#74758d,#46475b)" }
  ];

  const assignments = new Map();
  const list = document.getElementById("triage-list");
  const liveStatus = document.getElementById("live-status");

  function getInfluenceTier(score) {
    if (score >= 5000000) return { key: "universe", name: "UNIVERSE" };
    if (score >= 2000000) return { key: "singularity", name: "SINGULARITY" };
    if (score >= 1000000) return { key: "gravity", name: "GRAVITY" };
    if (score >= 500000)  return { key: "supernova", name: "SUPERNOVA" };
    if (score >= 150000)  return { key: "nova", name: "NOVA" };
    if (score >= 50000)   return { key: "star", name: "STAR" };
    if (score >= 20000)   return { key: "rising", name: "RISING" };
    if (score >= 5000)    return { key: "icon", name: "ICON" };
    if (score >= 1000)    return { key: "leader", name: "LEADER" };
    return { key: "human", name: "HUMAN" };
  }

  function formatScore(score) {
    if (score >= 1000000) {
      return (score / 1000000).toFixed(1).replace(".0", "") + "M";
    }
    if (score >= 1000) {
      return (score / 1000).toFixed(1).replace(".0", "") + "K";
    }
    return String(score);
  }

  function enamelHTML(tier) {
    return `
      <span class="enamel enamel--${tier.key}" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <use href="#mark-${tier.key}"></use>
        </svg>
      </span>
    `;
  }

  function chipHTML(person, key) {
    const circle = circles[key];
    return `
      <button
        class="tier-chip tier-chip--${key}"
        type="button"
        data-action="assign"
        data-person="${person.id}"
        data-circle="${key}"
        aria-label="${person.name}を${circle.label}に配置"
      >${circle.label}</button>
    `;
  }

  function rowHTML(person) {
    const tier = getInfluenceTier(person.score);

    return `
      <article class="person-row" id="row-${person.id}" data-person="${person.id}">
        <div class="person-default">
          <div class="person-main">
            <div class="avatar" style="--avatar-bg:${person.avatar}" aria-hidden="true">
              <span>${person.initials}</span>
            </div>

            <div class="person-info">
              <div class="person-name">${person.name}</div>
              <div class="person-meta">
                ${enamelHTML(tier)}
                <span class="tier-name tier--${tier.key}">${tier.name}</span>
                <span class="score">${formatScore(person.score)}</span>
              </div>
            </div>
          </div>

          <div class="tier-chips" aria-label="${person.name}の配置先">
            ${chipOrder.map(key => chipHTML(person, key)).join("")}
          </div>
        </div>

        <div class="confirmed-view">
          <button
            class="confirmed-main"
            type="button"
            data-action="reopen"
            data-person="${person.id}"
            aria-label="${person.name}の配置先を選び直す"
          >
            <span class="confirmed-orbit" aria-hidden="true"></span>
            <span class="confirmed-copy">
              <span class="confirmed-copy__top">
                <span class="confirmed-check">✓</span>
                <span class="confirmed-tier"></span>
                <span class="confirmed-divider">｜</span>
                <span class="confirmed-name">${person.name}</span>
              </span>
              <span class="confirmed-hint">タップで選び直し</span>
            </span>
          </button>

          <button
            class="undo-button"
            type="button"
            data-action="undo"
            data-person="${person.id}"
            aria-label="${person.name}の配置を取り消す"
          >取り消し</button>
        </div>
      </article>
    `;
  }

  function renderList() {
    list.innerHTML = people.map(rowHTML).join("");
  }

  function announce(message) {
    liveStatus.textContent = "";
    window.requestAnimationFrame(() => {
      liveStatus.textContent = message;
    });
  }

  function assign(personId, circleKey) {
    if (assignments.has(personId)) return;

    const circle = circles[circleKey];
    if (!circle) return;
    if (Number.isFinite(circle.max) && circle.current >= circle.max) return;

    const person = people.find(item => item.id === personId);
    const row = document.getElementById(`row-${personId}`);
    if (!person || !row) return;

    circle.current += 1;
    assignments.set(personId, circleKey);

    row.dataset.assigned = circleKey;
    row.querySelector(".confirmed-tier").textContent = circle.label;
    row.classList.add("is-confirmed");

    refreshUI();
    announce(`${person.name}を${circle.label}に配置しました`);
  }

  function clearAssignment(personId, mode) {
    const circleKey = assignments.get(personId);
    if (!circleKey) return;

    const person = people.find(item => item.id === personId);
    const row = document.getElementById(`row-${personId}`);
    if (!person || !row) return;

    circles[circleKey].current = Math.max(0, circles[circleKey].current - 1);
    assignments.delete(personId);

    row.classList.remove("is-confirmed");
    row.removeAttribute("data-assigned");

    refreshUI();

    if (mode === "reopen") {
      announce(`${person.name}の配置先を選び直せます`);
      window.requestAnimationFrame(() => {
        const firstAvailable = row.querySelector(".tier-chip:not(:disabled)");
        if (firstAvailable) firstAvailable.focus({ preventScroll: true });
      });
    } else {
      announce(`${person.name}の配置を取り消しました`);
    }
  }

  function refreshCapacity() {
    capacityOrder.forEach(key => {
      const circle = circles[key];
      const card = document.getElementById(`capacity-${key}`);
      const count = document.getElementById(`cap-${key}`);
      const fill = card.querySelector(".capacity-card__fill");
      const full = circle.current >= circle.max;

      count.textContent = `${circle.current}/${circle.max}`;
      fill.style.setProperty("--fill", `${Math.min(100, circle.current / circle.max * 100)}%`);
      card.classList.toggle("is-full", full);
      card.setAttribute(
        "aria-label",
        `${circle.label} ${circle.current}/${circle.max}${full ? "、満員" : ""}`
      );
    });
  }

  function refreshChips() {
    capacityOrder.forEach(key => {
      const circle = circles[key];
      const full = circle.current >= circle.max;

      document.querySelectorAll(`.tier-chip[data-circle="${key}"]`).forEach(button => {
        button.disabled = full;
        button.title = full ? `${circle.label}は満員です` : "";
      });
    });
  }

  function refreshUI() {
    const remaining = people.length - assignments.size;

    document.getElementById("remaining-count").textContent = remaining;
    document.getElementById("assignment-progress").textContent =
      `${assignments.size} / ${people.length} 配置済み`;

    refreshCapacity();
    refreshChips();
  }

  list.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const action = button.dataset.action;
    const personId = button.dataset.person;

    if (action === "assign") {
      assign(personId, button.dataset.circle);
    } else if (action === "reopen") {
      clearAssignment(personId, "reopen");
    } else if (action === "undo") {
      clearAssignment(personId, "undo");
    }
  });

  renderList();
  refreshUI();
})();
</script>
</body>
</html>
